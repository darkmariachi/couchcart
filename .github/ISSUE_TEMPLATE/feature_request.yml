name: Feature request
description: Suggest something Couchcart could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: markdown
    attributes:
      value: >
        Couchcart is a launcher and save-sync client. It does not embed emulators, and it does not
        include or link to games, BIOS files or artwork.

appId: app.couchcart.desktop
productName: Couchcart
copyright: Couchcart contributors

directories:
  output: dist
  buildResources: build

# Everything the app needs is bundled into out/ by electron-vite, so no node_modules
# are shipped.
files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
asar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Couchcart-${version}-setup.${ext}

portable:
  artifactName: Couchcart-${version}-portable.${ext}

linux:
  icon: build/icon.png
  category: Game
  target:
    - AppImage

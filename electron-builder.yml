appId: app.rommlauncher.desktop
productName: RomM Launcher
copyright: RomM Launcher contributors

directories:
  output: dist
  buildResources: build

# Everything the app needs is bundled into out/ by electron-vite, so no node_modules
# are shipped.
files:
  - out/**
  - package.json
asar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: RomM-Launcher-${version}-setup.${ext}

portable:
  artifactName: RomM-Launcher-${version}-portable.${ext}

linux:
  icon: build/icon.png
  category: Game
  target:
    - AppImage
